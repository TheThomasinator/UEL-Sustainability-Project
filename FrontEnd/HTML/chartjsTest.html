<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Chart JS</title>
		<link rel="stylesheet" href="../CSS/style.css">
		<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1R7waxfnSfrnAyf5ncie_waqj6zBP5m3f">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
		<!-- Chart.js^
			https://stackoverflow.com/questions/43952022/how-to-install-chart-js
			https://www.geeksforgeeks.org/javascript/charts-js-installation-guide/
			
			going to official chart.js distribution website with a trusted CDN (cdnjs)
			the file used:
				umd means it's browser ready
				min means minified, so it's smaller & faster
				and it's the latest version as of today 18/04/2026, 4.5.0
			it's just the chart.js library itself, doesn't bring in any other unofficial code, non-vanilla.
		-->
	</head>
	
	<body>
		<canvas id="myChart" width="400" height="400"></canvas>
		
		<script>
			// https://stackoverflow.com/questions/43952022/how-to-install-chart-js
			// this is just example code to generate a bar chart with chart.js and a HTML canvas element.
			var ctx = document.getElementById("myChart");
			var myChart = new Chart(ctx, {
			type: 'bar',
			data: {
				labels: ["Red", "Blue", "Yellow", "Green", "Purple", "Orange"],
				datasets: [{
					label: '# of Votes',
					data: [12, 19, 3, 5, 2, 3],
					backgroundColor: [
						'rgba(255, 99, 132, 0.2)',
						'rgba(54, 162, 235, 0.2)',
						'rgba(255, 206, 86, 0.2)',
						'rgba(75, 192, 192, 0.2)',
						'rgba(153, 102, 255, 0.2)',
						'rgba(255, 159, 64, 0.2)'
					],
					borderColor: [
						'rgba(255,99,132,1)',
						'rgba(54, 162, 235, 1)',
						'rgba(255, 206, 86, 1)',
						'rgba(75, 192, 192, 1)',
						'rgba(153, 102, 255, 1)',
						'rgba(255, 159, 64, 1)'
					],
					borderWidth: 1
				}]
			},
			options: {
				scales: {
					yAxes: [{
						ticks: {
							beginAtZero:true
						}
					}]
				}
			}
			});
		</script>
	</body>
</html>
